<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora&family=Libre+Baskerville&family=EB+Garamond&family=Cormorant+Garamond&family=Crimson+Text&family=Bitter&family=Arvo&family=Zilla+Slab&family=Alfa+Slab+One&family=Bungee&family=Orbitron&family=Audiowide&family=Russo+One&family=Staatliches&family=Teko&family=Fjalla+One&family=Monoton&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sacramento&family=Parisienne&family=Allura&family=Kaushan+Script&family=Courgette&family=Amatic+SC&family=Shadows+Into+Light&family=Indie+Flower&family=Special+Elite&family=Press+Start+2P&family=Fira+Code&family=JetBrains+Mono&family=Space+Mono&family=Inconsolata&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Anton&family=Archivo+Black&family=Bangers&family=Bebas+Neue&family=Caveat:wght@400;700&family=Cinzel:wght@400;700&family=Dancing+Script:wght@400;700&family=Fredoka:wght@400;700&family=Great+Vibes&family=Lobster&family=Merriweather:wght@400;700&family=Montserrat:wght@400;700&family=Oswald:wght@400;700&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;700&family=Raleway:wght@400;700&family=Righteous&family=Roboto+Slab:wght@400;700&family=Satisfy&display=swap">
<style>
/* Layout: full-screen editor. Top bar, canvas, collapsible property sheet, bottom tool rail. */
:root{--bg:#E6EAEE;--panel:#FFFFFF;--panel2:#F3F5F7;--ink:#17212B;--mute:#5C6B7A;--line:#D3D9E0;--accent:#0E7C86;--accent-ink:#FFFFFF;--accent-soft:#D9EEF0;--danger:#B3382C;--font-ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--font-brand:'Space Grotesk','Inter',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151A;--panel:#1A2129;--panel2:#222B35;--ink:#E7ECF1;--mute:#93A0AD;--line:#2D3843;--accent:#3FC2CD;--accent-ink:#06262A;--accent-soft:#1B3E43;--danger:#F08A7E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151A;--panel:#1A2129;--panel2:#222B35;--ink:#E7ECF1;--mute:#93A0AD;--line:#2D3843;--accent:#3FC2CD;--accent-ink:#06262A;--accent-soft:#1B3E43;--danger:#F08A7E;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--font-ui);overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;min-width:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ib{width:40px;height:40px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--ink)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:active{background:var(--panel2)}
.ib[disabled]{opacity:.35}
.ib.on{background:var(--accent-soft);color:var(--accent)}
#top{display:flex;align-items:center;gap:2px;padding:6px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;min-width:0}
#brand{font:700 15px var(--font-brand);letter-spacing:.01em;margin-right:auto;white-space:nowrap}
#zoomlbl{min-width:46px;text-align:center;font-variant-numeric:tabular-nums;font-size:12px;color:var(--mute);border:0;background:none}
.pill{height:36px;padding:0 14px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600}
#stage{position:relative;flex:1;min-height:0;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;user-select:none;-webkit-user-select:none}
#chips{position:absolute;left:12px;top:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.chip{pointer-events:auto;height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:500;color:var(--mute)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);max-width:90%;background:var(--ink);color:var(--bg);padding:6px 12px;border-radius:14px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .2s;text-align:center}
#hint.show{opacity:.92}
#penbar{position:absolute;right:12px;top:10px;display:flex;gap:6px}
#sheet{flex:none;background:var(--panel);border-top:1px solid var(--line);height:min(300px,42%);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;gap:4px;padding:6px 16px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tab{border:0;background:none;padding:8px 12px;font-weight:600;font-size:13px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
#sbody{flex:1;overflow:auto;padding:12px 16px 16px;min-height:0}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;min-width:0}
.row>label{width:78px;color:var(--mute);font-size:12px;flex:none}
.row input[type=range]{flex:1;min-width:110px;accent-color:var(--accent)}
.row input[type=color]{width:44px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:none}
.row select,.row input[type=text],.row input[type=number]{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:0 8px;min-width:0}
.row input[type=number]{width:70px}
.val{width:36px;text-align:right;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel2);height:34px;padding:0 12px;font-size:12px;font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.btn{height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-weight:500}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dng{color:var(--danger)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-bottom:10px}
.grid .btn{padding:6px;font-size:12px;height:auto;min-height:36px;line-height:1.25}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw i{width:28px;height:28px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);display:block;cursor:pointer}
.empty{color:var(--mute);padding:18px 0;text-align:center}
.layer{display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:9px;border:1px solid transparent}
.layer.on{background:var(--accent-soft);border-color:var(--accent)}
.layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px 4px;border:0;background:none;text-align:left}
.layer .ib{width:34px;height:34px}.layer .ib svg{width:18px;height:18px}
.thumb{width:26px;height:26px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);flex:none}
#tools{display:flex;gap:2px;padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
#tools .ib{width:46px;height:46px;border-radius:12px}
.sep{width:1px;background:var(--line);margin:6px 4px;flex:none}
.ov{position:fixed;inset:0;background:rgba(10,16,22,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.ov[hidden]{display:none}
.dlg{background:var(--panel);width:min(480px,100%);max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.ov{align-items:center}.dlg{border-radius:18px}}
.dlg h2{font:700 17px var(--font-brand);margin:0 0 12px}
.dlg textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:10px;resize:vertical}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.note{font-size:12px;color:var(--mute);margin:6px 0 0}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:16px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (hover:hover){.ib:hover{background:var(--panel2)}.btn:hover,.chip:hover{border-color:var(--accent)}.sw i:hover{transform:scale(1.12)}.layer .nm:hover{text-decoration:underline}}
/* Laptop and desktop: tool rail on the left, properties panel always open on the right */
@media (min-width:900px){
 #app{display:grid;grid-template-columns:68px minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr)}
 #top{grid-column:1/-1;padding:6px 18px}
 #tools{grid-column:1;grid-row:2;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-top:0;border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden}
 #tools .sep{width:34px;height:1px;margin:6px 0}
 #stage{grid-column:2;grid-row:2}
 #sheet{grid-column:3;grid-row:2;height:auto;border-top:0;border-left:1px solid var(--line)}
 #bProps{display:none}
 #tabs{padding:6px 10px 0;gap:0}.tab{padding:8px 11px}
 #brand{font-size:17px}
 #hint{bottom:16px}
}
@media (max-width:520px){#bZin,#bZout{display:none}#brand{font-size:14px}#top{gap:0}.pill{padding:0 12px}}
#rulerH,#rulerV,#rulerC{position:absolute;background:var(--panel);z-index:3;touch-action:none}
#rulerH{left:22px;top:0;height:22px;width:calc(100% - 22px);border-bottom:1px solid var(--line);cursor:s-resize}
#rulerV{left:0;top:22px;width:22px;height:calc(100% - 22px);border-right:1px solid var(--line);cursor:e-resize}
#rulerC{left:0;top:0;width:22px;height:22px;background:var(--panel2);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
#stage.rul #chips{left:32px;top:30px}#stage.rul #penbar{top:30px}
@media (max-width:899px){#cRul{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div id="app">
  <header id="top">
    <span id="brand">DrawFree Studio</span>
    <button class="ib" id="bUndo" aria-label="Undo"></button>
    <button class="ib" id="bRedo" aria-label="Redo"></button>
    <button class="ib" id="bZout" aria-label="Zoom out"></button>
    <button id="zoomlbl" aria-label="Fit page to screen">100%</button>
    <button class="ib" id="bZin" aria-label="Zoom in"></button>
    <button class="ib" id="bMenu" aria-label="File menu"></button>
    <button class="pill" id="bExport">Export</button>
  </header>
  <main id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="chips">
      <button class="chip" id="cMulti">Multi-select</button>
      <button class="chip" id="cGrid">Grid</button>
      <button class="chip" id="cSnap">Snap</button>
      <button class="chip" id="cRul">Rulers</button>

    </div>
    <canvas id="rulerH" hidden></canvas><canvas id="rulerV" hidden></canvas><div id="rulerC" hidden></div>
    <div id="penbar" hidden><button class="chip on" id="penDone">Finish shape</button><button class="chip" id="penCancel">Cancel</button></div>
    <div id="hint"></div>
  </main>
  <section id="sheet" hidden>
    <div id="tabs"></div>
    <div id="sbody"></div>

  <nav id="tools" aria-label="Tools"></nav>
</div>
<div class="ov" id="ovText" hidden><div class="dlg"><h2>Edit text</h2><textarea id="txtIn" spellcheck="true" placeholder="Type your text"></textarea><div style="display:flex;gap:10px;align-items:center;margin:10px 0 2px"><label for="txtCurve" style="flex:none;width:58px;font-weight:600">Curve</label><input type="range" id="txtCurve" min="-100" max="100" value="0" style="flex:1"><span id="txtCurveV" style="width:42px;text-align:right">0%</span></div><div style="display:flex;gap:10px;align-items:center;margin:6px 0 2px"><label for="txtSize" style="flex:none;width:58px;font-weight:600">Size</label><input type="range" id="txtSize" min="8" max="400" value="60" style="flex:1"><span id="txtSizeV" style="width:42px;text-align:right">60</span></div><div class="acts"><button class="btn" id="txtCancel">Cancel</button><button class="btn pri" id="txtOk">Done</button></div></div></div>
<div class="ov" id="ovMenu" hidden><div class="dlg" id="menuBody"></div></div>
<div class="ov" id="ovExp" hidden><div class="dlg" id="expBody"></div></div>
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fProj" accept=".json,application/json" hidden>
<div id="toast"></div>

const NEW=[['Lato','Sans'],['Open Sans','Sans'],['Roboto','Sans'],['Nunito','Sans'],['Work Sans','Sans'],['DM Sans','Sans'],['Rubik','Sans'],['Quicksand','Sans'],['Barlow','Sans'],['Josefin Sans','Sans'],['Cabin','Sans'],['Ubuntu','Sans'],['Kanit','Sans'],['Comfortaa','Display'],
 ['Lora','Serif'],['Libre Baskerville','Serif'],['EB Garamond','Serif'],['Cormorant Garamond','Serif'],['Crimson Text','Serif'],['Bitter','Serif'],['Arvo','Serif'],['Zilla Slab','Serif'],['Alfa Slab One','Display'],['Bungee','Display'],['Orbitron','Display'],['Audiowide','Display'],['Russo One','Display'],['Staatliches','Display'],['Teko','Display'],['Fjalla One','Display'],['Monoton','Display'],
 ['Sacramento','Script'],['Parisienne','Script'],['Allura','Script'],['Kaushan Script','Script'],['Courgette','Script'],['Amatic SC','Script'],['Shadows Into Light','Script'],['Indie Flower','Script'],['Special Elite','Display'],['Press Start 2P','Display'],['Fira Code','Mono'],['JetBrains Mono','Mono'],['Space Mono','Mono'],['Inconsolata','Mono']];
const CAT={'Sans':'Sans','Serif':'Serif','Mono':'Mono','Impact':'Display','Trebuchet':'Sans','Verdana':'Sans','Palatino':'Serif','Casual':'Script','Poppins':'Sans','Montserrat':'Sans','Raleway':'Sans','Oswald':'Display','Fredoka':'Display','Playfair Display':'Serif','Merriweather':'Serif','Roboto Slab':'Serif','Cinzel':'Serif','Abril Fatface':'Display','Bebas Neue':'Display','Anton':'Display','Archivo Black':'Display','Righteous':'Display','Bangers':'Display','Lobster':'Script','Pacifico':'Script','Dancing Script':'Script','Great Vibes':'Script','Satisfy':'Script','Caveat':'Script','Permanent Marker':'Script'};
NEW.forEach(n=>{if(!FONTS.some(f=>f[1]===n[0]))FONTS.push(["'"+n[0]+"',"+(n[1]==='Serif'?'serif':n[1]==='Mono'?'monospace':n[1]==='Script'?'cursive':'sans-serif'),n[0]]);CAT[n[0]]=n[1]});
let FAV=[],MINE=[];try{FAV=JSON.parse(localStorage.getItem('drawfree.favfonts')||'[]')}catch(e){}
const saveFav=()=>{try{localStorage.setItem('drawfree.favfonts',JSON.stringify(FAV))}catch(e){}};
async function addMine(name,buf,persist){const fam='My '+name;const ff=new FontFace(fam,buf);await ff.load();document.fonts.add(ff);if(!FONTS.some(f=>f[1]===fam))FONTS.push(["'"+fam+"',sans-serif",fam]);CAT[fam]='Mine';
  if(persist){try{const u8=new Uint8Array(buf);let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));const all=JSON.parse(localStorage.getItem('drawfree.myfonts')||'[]');all.push([name,btoa(s)]);localStorage.setItem('drawfree.myfonts',JSON.stringify(all))}catch(e){return false}}return true}
try{(JSON.parse(localStorage.getItem('drawfree.myfonts')||'[]')).forEach(a=>{const s=atob(a[1]),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);addMine(a[0],u.buffer,false).catch(()=>{})})}catch(e){}
let fq='',fc='All',fp='The quick brown fox jumps over the lazy dog 0123456789';
function fontManager(){
  const cats=['All','Favourites','Sans','Serif','Display','Script','Mono','Mine'];
  const rows=FONTS.filter(f=>{const c=CAT[f[1]]||'Sans';if(fc==='Favourites'&&!FAV.includes(f[1]))return false;if(fc!=='All'&&fc!=='Favourites'&&c!==fc)return false;return !fq||f[1].toLowerCase().includes(fq.toLowerCase())});
  openOv('ovMenu','<h2>Font manager</h2><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"><input id="fmQ" placeholder="Search fonts" value="'+esc(fq)+'" style="flex:1;min-width:120px;height:36px;padding:0 10px"><label class="btn" style="height:36px;display:flex;align-items:center;padding:0 10px;cursor:pointer">Install font file<input id="fmFile" type="file" accept=".ttf,.otf,.woff,.woff2" hidden></label></div>'+
   '<input id="fmP" value="'+esc(fp)+'" style="width:100%;height:36px;padding:0 10px;margin-bottom:8px" aria-label="Preview text"><div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:8px">'+cats.map(c=>'<button class="btn'+(c===fc?' pri':'')+'" data-fc="'+c+'" style="height:32px;flex:none">'+c+'</button>').join('')+'</div>'+
   '<p class="note" style="margin:0 0 8px">'+rows.length+' fonts. Tap Use to apply a font to the selected text, or to add new text in it. The star keeps a font in Favourites. Installed files stay on this device only.</p>'+
   '<div style="max-height:46vh;overflow:auto">'+rows.map(f=>'<div style="display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)"><div style="flex:1;min-width:0"><div style="font-size:11.5px;opacity:.65">'+esc(f[1])+' · '+(CAT[f[1]]||'Sans')+'</div><div style="font:26px/1.2 '+f[0].replace(/"/g,"'")+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(fp)+'</div></div><button class="btn" data-fv="'+esc(f[1])+'" style="height:34px;flex:none" aria-label="Favourite">'+(FAV.includes(f[1])?'★':'☆')+'</button><button class="btn pri" data-fu="'+esc(f[1])+'" style="height:34px;flex:none">Use</button></div>').join('')+'</div><div class="acts"><button class="btn" id="fmClose">Close</button></div>');
  const m=$('menuBody'),re=()=>fontManager();
  $('fmClose').onclick=()=>{$('ovMenu').hidden=true};
  $('fmQ').oninput=e=>{fq=e.target.value;re();const q=$('fmQ');q.focus();q.setSelectionRange(fq.length,fq.length)};
  $('fmP').oninput=e=>{fp=e.target.value;m.querySelectorAll('div[style*="font:26px"]').forEach(d=>d.textContent=fp)};
  m.querySelectorAll('[data-fc]').forEach(b=>b.onclick=()=>{fc=b.dataset.fc;re()});
  m.querySelectorAll('[data-fv]').forEach(b=>b.onclick=()=>{const n=b.dataset.fv;const i=FAV.indexOf(n);if(i>=0)FAV.splice(i,1);else FAV.push(n);saveFav();re()});
  m.querySelectorAll('[data-fu]').forEach(b=>b.onclick=()=>{const f=FONTS.find(x=>x[1]===b.dataset.fu);useFont(f)});
  $('fmFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const buf=await f.arrayBuffer(),nm=f.name.replace(/\.[^.]+$/,'').replace(/[^\w \-]/g,'').slice(0,30)||'Font';const kept=await addMine(nm,buf,true);toast(kept?'Installed "My '+nm+'". Find it under Mine.':'Installed for this session only (too big to keep).');fc='Mine';re()}catch(x){toast('That file could not be read as a font.')}};
}
function useFont(f){
  loadFonts([f[0]],()=>{const ts=sel.map(getObj).filter(o=>o&&o.type==='text');
    if(ts.length){ts.forEach(o=>{const cx=o.x+o.w/2,l=o.x;o.font=f[0];fitText(o);o.x=o.align==='left'?l:cx-o.w/2});render();commit();renderSheet();toast('Font changed to '+f[1])}
    else{const o=base('text',0,0,10,10);Object.assign(o,{text:'Your text here',font:f[0],size:Math.round(doc.w/12),bold:false,italic:false,align:'center',fill:cur.fill==='none'?'#111111':cur.fill,sw:0});fitText(o);o.x=doc.w/2-o.w/2;o.y=doc.h/2-o.h/2;o.name='Text';addObj(o);sel=[o.id];render();commit();renderSheet();toast('Text added in '+f[1])}
    $('ovMenu').hidden=true})}
function captureUI(){
  openOv('ovMenu','<h2>Add a picture without downloading it</h2><p class="note" style="margin:0 0 10px">On a website, right-click the picture and choose Copy image (on a phone, press and hold it and tap Copy). Then paste it into the box below. No saving or uploading needed.</p><div class="grid" style="grid-template-columns:1fr">'+
   '<button class="btn pri" id="cpPB" style="height:48px">Paste copied picture</button><div id="cpPaste" contenteditable="true" role="textbox" aria-label="Paste a picture here" style="border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;min-height:70px;outline:none;font-weight:600">Paste the copied picture here (Ctrl+V, or press and hold, then Paste)</div><label class="btn" style="display:flex;align-items:center;justify-content:center;height:44px;cursor:pointer">Take a photo with the camera<input id="cpCam" type="file" accept="image/*" capture="environment" hidden></label>'+
   '<button class="btn" id="cpScr" style="height:44px">Capture my screen or a window</button>'+
   
   '<label class="btn" style="display:flex;align-items:center;justify-content:center;height:44px;cursor:pointer">Choose a screenshot or picture file<input id="cpFile" type="file" accept="image/*" hidden></label></div><p id="cpMsg" class="note" style="margin:10px 0 0"></p><div class="acts"><button class="btn" id="cpClose">Close</button></div>');
  const done=f=>{$('ovMenu').hidden=true;importImageFile(f)};
  $('cpPB').onclick=async()=>{const msg=t=>{$('cpMsg').textContent=t},box=$('cpPaste');try{if(!(navigator.clipboard&&navigator.clipboard.read))throw 0;const items=await navigator.clipboard.read();for(const it of items){const ty=it.types.find(x=>/^image\//.test(x));if(ty){const bl=await it.getType(ty);done(new File([bl],'pasted.png',{type:ty}));return}}msg('There is no picture on the clipboard yet. Copy one first, then tap Paste again.')}catch(e){box.focus();msg('Your browser does not let this page read the clipboard by itself. Press and hold inside the dashed box, then tap Paste (on a computer press Ctrl+V).')}};
  $('cpClose').onclick=()=>{$('ovMenu').hidden=true};
  $('cpCam').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)done(f)};$('cpFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)done(f)};
  $('cpPaste').onpaste=e=>{const it=e.clipboardData&&[...e.clipboardData.items].find(x=>x.kind==='file'&&/^image\//.test(x.type));e.preventDefault();e.stopPropagation();if(it)done(it.getAsFile());else $('cpMsg').textContent='No picture found on the clipboard. Take a screenshot first, then paste.'};
  $('cpScr').onclick=async()=>{const msg=t=>{$('cpMsg').textContent=t};if(!(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia)){msg('Screen capture is not available here. Take a screenshot with your device buttons, then paste or choose it above.');return}
    try{const st=await navigator.mediaDevices.getDisplayMedia({video:true}),v=document.createElement('video');v.srcObject=st;v.muted=true;await v.play();await new Promise(r=>setTimeout(r,350));const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);st.getTracks().forEach(t=>t.stop());c.toBlob(b=>done(new File([b],'capture.png',{type:'image/png'})),'image/png')}
    catch(e){msg('Your browser did not allow screen capture here. Take a screenshot with your device buttons (phone: power + volume down), then paste or choose it above.')}}}
window.fontManager=fontManager;window.captureUI=captureUI;
})();

/* offline support when the app is hosted on its own address */
(function(){try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').then(function(){if(!document.querySelector('link[rel=manifest]')){var l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l)}}).catch(function(){})}}catch(e){}})();


/* drop and paste pictures */
(function(){const st=$('stage');if(!st)return;
  ['dragenter','dragover'].forEach(ev=>st.addEventListener(ev,e=>{if(e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files')){e.preventDefault()}}));
  st.addEventListener('drop',e=>{const f=e.dataTransfer&&[...e.dataTransfer.files].find(x=>/^image\//.test(x.type));if(f){e.preventDefault();importImageFile(f)}else if(e.dataTransfer&&[...e.dataTransfer.types].some(t=>/uri-list|html/.test(t))){e.preventDefault();toast('That website would not hand over the picture. Right-click it, choose Copy image, then paste here with Ctrl+V.')}});
  document.addEventListener('paste',e=>{const t=e.target;if(t&&/INPUT|TEXTAREA/.test(t.tagName))return;const it=e.clipboardData&&[...e.clipboardData.items].find(x=>x.kind==='file'&&/^image\//.test(x.type));if(it){e.preventDefault();importImageFile(it.getAsFile())}})})();







/* ---------- start ---------- */
try{const s=JSON.parse(localStorage.getItem('drawfree.doc')||'null');IMGS=JSON.parse(localStorage.getItem('drawfree.imgs')||'{}')||{};if(s&&(Array.isArray(s.pages)||(s.doc&&Array.isArray(s.doc.objs)))){applySnap(s);nid=s.nid||1;pages.forEach(p=>p.objs.forEach(o=>{nid=Math.max(nid,o.id+1)}))}else seedDoc()}catch(x){seedDoc()}
const mq=window.matchMedia('(min-width:900px)'),applyMq=()=>{$('sheet').hidden=!mq.matches;$('bProps').classList.toggle('on',mq.matches);if(mq.matches)renderSheet()};
applyMq();if(mq.addEventListener)mq.addEventListener('change',applyMq);
syncTools();render();fitView();commit();syncUndo();
if(mq.matches)setRulers(true);pagesUI();
loadFonts(doc.objs.filter(o=>o.type==='text').map(o=>o.font),()=>{doc.objs.forEach(o=>{if(o.type==='text'){const cx=o.x+o.w/2,cy=o.y+o.h/2;fitText(o);o.x=cx-o.w/2;o.y=cy-o.h/2}});render()});setTimeout(()=>hint(mq.matches?'Click a shape to edit it. Scroll to zoom. Hold Space and drag to pan.':'Tap a shape to edit it. Use two fingers to zoom. Tap Properties below for colors.'),400);
})();
</script>
